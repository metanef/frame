<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863BFF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="gradSubtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863BFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.15" />
    </linearGradient>
  </defs>
  
  <!-- The Outer Frame -->
  <rect x="64" y="64" width="384" height="384" rx="96" fill="none" stroke="url(#grad)" stroke-width="36" />
  
  <!-- Mini Grid of Habit Cubes (Material style) -->
  <rect x="180" y="180" width="68" height="68" rx="16" fill="url(#gradSubtle)" stroke="url(#grad)" stroke-width="4" stroke-opacity="0.3" />
  <rect x="264" y="180" width="68" height="68" rx="16" fill="url(#gradSubtle)" stroke="url(#grad)" stroke-width="4" stroke-opacity="0.3" />
  <rect x="180" y="264" width="68" height="68" rx="16" fill="url(#gradSubtle)" stroke="url(#grad)" stroke-width="4" stroke-opacity="0.3" />
  <rect x="264" y="264" width="68" height="68" rx="16" fill="url(#grad)" />
</svg>
